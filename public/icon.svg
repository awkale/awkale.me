<!-- awkale.me — AK in Clarendon LT Std. Outlines extracted from the embedded CFF
     subset of the 2015 favicon.ai, placed with that file's own text matrix
     (19pt at 0.6396,10.459 in a 32x32 box), y-flipped for SVG. AWK-50.

     ONE colour for both schemes, on purpose: #f76b15 carries against a white and
     a near-black tab strip alike, so the mark needs no prefers-color-scheme rule.
     A theme-aware fill was tried and dropped — it only ever applied in the
     browsers that take the SVG, leaving Safari on the .ico regardless.

     #f76b15 is DELIBERATELY NOT the site's accent. That is --ember-9 (#e05822),
     which tokens.css generated the whole ramp from. This is Radix orange-9, kept
     as an icon-only exception — decided in AWK-52, not an oversight, so please do
     not "fix" it to match. It also cannot track the accent: a favicon renders in
     isolation and cannot read a custom property, so an accent retune leaves this
     file behind. Changing it means editing here, the .ico, and the test.

     DO NOT hand-edit the path data. It is generated; retyping it silently
     corrupts a contour. Regenerate from the .ai instead. -->
