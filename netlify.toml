# Netlify configuration — awkale.me
#
# Kept in the repo rather than the dashboard deliberately. ADR-0002 chose Netlify
# partly for config-as-code, and `docs/research/0001-static-rendering-layer.md`
# records that Netlify's own React Router guide documents ONLY the server
# deployment via @netlify/vite-plugin-react-router targeting Functions — the
# static `ssr: false` route is not covered by any recipe. So a hand-written file
# is the supported-in-practice path, not a shortcut.
#
# AWK-17 verified this live: Netlify auto-detected `framework: "react-router"`
# and served build/client from a hand-written toml with zero functions.
# 594 routes built in 22 s, which is 2.4% of the 900 s limit.

[build]
# React Router framework mode with `ssr: false` + `prerender` emits real HTML
# per route into build/client — a plain static publish dir, which is what keeps
# _redirects and _headers working normally.
publish = "build/client"

# bun per project convention. `package.json` and `bun.lock` are both committed,
# so Netlify detects the toolchain and this command runs. (This previously
# warned that neither existed and the repo held scaffolding only — true when
# written, false since the AWK-22 scaffolding was wired up. Note the lockfile is
# `bun.lock`, not the `bun.lockb` the old comment named.)
command = "bun run build"

[build.environment]
# React Router 8.x needs Node 20+. Pinned so a Netlify default bump cannot
# move it underneath us; raise deliberately.
#
# This previously read "7.18.x". The pin was superseded rather than satisfied —
# `bun create react-router` now scaffolds v8, which ADR-0009 adopts. The Node
# floor is 20+ either way, so "22" was correct before and after.
NODE_VERSION = "22"

# --- notes for whoever wires this up -----------------------------------------
#
# _headers and _redirects must live in the PUBLISH directory to take effect, not
# at the repo root. Vite copies public/* into build/client/, so they belong in
# public/ — see public/_headers, which carries the staging noindex.
#
# Do NOT add a catch-all redirect to a SPA fallback. AWK-17's single most valuable
# finding: with no catch-all, a missing page returns a real 404. Add one and every
# unknown path silently serves an empty HydrateFallback shell instead — across the
# whole archive. Verified live.
#
# Environment variables are set in the Netlify UI, never here — this file is
# committed. ADR-0002 specifies CONTENTFUL_SPACE_ID (3iiyvj5u5c9h),
# CONTENTFUL_ENVIRONMENT (master) and a read-only Delivery token. The CFPAT-…
# Content Management token must NEVER enter CI; it stays local in
# ~/.contentful-cma-token.
#
# ALL THREE ARE NOW REQUIRED, as of AWK-39 — this previously read "none are needed
# yet". The build reads the Delivery API for every path it prerenders, so a
# missing one is not a degraded build, it is an empty site. app/lib/contentful.ts
# asserts them before fetching anything so that fails loudly instead.
#
# The names in the dashboard, verified 2026-08-15: CONTENTFUL_SPACE_ID and
# CONTENTFUL_ENVIRONMENT are all-scopes with one value across every deploy
# context; CONTENTFUL_DELIVERY_TOKEN is scoped to Builds, Functions and Runtime
# and holds FOUR values across four contexts. That last asymmetry is the one to
# watch — a context whose token is empty builds a green, contentless site.
#
# See .env.example, which carries the same three names for local builds.

# --- Netlify Image CDN: the browser's only image origin is this one -----------
#
# ADR-0013. Netlify fetches each Contentful file server-side, transforms it, and
# caches the result at its edge, so the browser never connects to
# images.ctfassets.net. That is what makes `img-src 'self'` in public/_headers
# true rather than aspirational, and it is why no image transform code exists in
# this repo: it is a platform feature, like ADR-0011's forms.
#
# THE QUOTES ARE LOAD-BEARING. This is a TOML *literal* string — single quotes —
# where a backslash is a backslash. Netlify's own documented example uses double
# quotes, in which `\.` must be written `\\.` or the escape is consumed before
# the regex ever sees it; their example sidesteps the trap by leaving the dots
# unescaped, which quietly makes `.` match any character. Do not "tidy" these to
# double quotes.
#
# SPACE-SCOPED, not domain-wide. `images\.ctfassets\.net/.*` would survive a
# space change untouched and was rejected: it would let this site fetch,
# transform and serve ANY Contentful customer's public asset. The space id is
# already committed above and in ADR-0002, so nothing is leaked by naming it.
#
# There is nothing to switch on in the UI — verified live on two other personal
# projects: `/.netlify/images` answers on every site by default, and an
# un-allowlisted source fails loudly with
# `400 {"code":400,"msg":"url (…) is not an allowed pattern"}`. The opposite of
# Forms, which is UI-only and fails silently when forgotten.
#
# Transformed bytes count against Netlify's 100 GB bandwidth, not Contentful's
# metered 50 GB. Both are hard stops; ADR-0013 chose the meter this project
# already watches. Image transformations are not themselves metered on the
# legacy Free plan.
#
# ANCHORED WITH ^ AND $, and not as ceremony. Netlify documents these entries as
# matching the whole URL, but that is their word rather than something this repo can
# see: under substring semantics the unanchored form is also satisfied by
# `https://attacker.example/r?u=https://images.ctfassets.net/3iiyvj5u5c9h/x`, which
# would make this site an open image proxy — the exact outcome the space scoping
# above exists to prevent. Anchoring costs nothing and makes the claim true either
# way.
#
# Probed locally through @netlify/vite-plugin, and the anchors are insurance rather
# than a hole being closed: that proxy-shaped URL was already refused BEFORE they were
# added, so the matcher does appear to be whole-URL. With them, an allowlisted asset
# still answers 200 (`w=1400` → a real 1400 × 875 PNG), another space 403s, and the
# proxy shape 403s. The anchors mean the property no longer rests on that observation.
#
# app/lib/images.ts is the only thing that builds URLs against this, and
# scripts/netlify-images.test.ts asserts the pattern below still means what it
# looks like — including that its space id matches that file's SOURCE_SPACE.
[images]
remote_images = ['^https://images\.ctfassets\.net/3iiyvj5u5c9h/.*$']
